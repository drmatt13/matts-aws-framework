# Generated by npm run framework:generate from framework.config.ts and the
# x-framework-service container in docker-compose.yml, which includes this file. Do not edit it:
# generation replaces it.
#
# One container for each service framework.config.ts runs locally. Each is
# x-framework-service as written, plus what its declaration decides: the container
# name (its id, which the local API dev server proxies to), the run-service
# command for its workspace's dev script, PORT, and a probe of its
# healthCheckPath. To change one service, add to it in
# docker-compose.override.yml, which Compose merges over everything, or declare
# it in docker-compose.yml under its id; this file then leaves it out.

# x-framework-service from docker-compose.yml, resolved.
x-service: &service
  build:
    context: .
    dockerfile: Dockerfile.dev
  init: true
  develop:
    watch:
      - action: sync
        path: .
        target: /workspace
        initial_sync: true
        ignore:
          - "**/node_modules/"
          - "**/.env*"
          - "**/dist/"
          - "**/cdk.out/"
          - .cache/
          - .framework/
          - .git/
          - "**/package.json"
          - package-lock.json
          - "**/Dockerfile*"
          - "**/dockerfile"
          - framework.config.ts
          - framework-config/
          - packages/framework/src/
          - packages/framework/scripts/
          - packages/database/prisma/
          - packages/database/src/generated/
      - action: sync+restart
        path: ./framework.config.ts
        target: /workspace/framework.config.ts
      - action: sync+restart
        path: ./framework-config
        target: /workspace/framework-config
      - action: sync+restart
        path: ./packages/framework/src
        target: /workspace/packages/framework/src
      - action: sync+restart
        path: ./packages/framework/scripts
        target: /workspace/packages/framework/scripts
  volumes:
    - type: bind
      source: ${LOCAL_AWS_CONFIG_DIR:?Run npm run export:cdk-outputs to prepare root .env}
      target: /root/.aws
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./.framework/local
      target: /workspace/.framework/local
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./cdk-app/.env
      target: /workspace/cdk-app/.env
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    postgres:
      condition: service_healthy
    prisma-migrate:
      condition: service_completed_successfully
    prune-cognito-orphans:
      condition: service_completed_successfully
    seed-test-user:
      condition: service_completed_successfully
x-service-environment: &service-environment
  AWS_PROFILE: ${LOCAL_AWS_PROFILE:-default}
  AWS_REGION: ${LOCAL_AWS_REGION:-us-east-1}
  AWS_SDK_LOAD_CONFIG: "1"
  USER_POOL_ID: ${USER_POOL_ID}
  USER_POOL_CLIENT_ID: ${USER_POOL_CLIENT_ID}
  COGNITO_DOMAIN_URL: ${COGNITO_DOMAIN_URL}
  LOCAL_BROWSER_ORIGINS: ${LOCAL_BROWSER_ORIGINS}
  PRIMARY_DATABASE_URL: postgresql://admin:password@postgres:5432/app_db
  LOCAL_FRAMEWORK_DEPLOYMENT: ${LOCAL_FRAMEWORK_DEPLOYMENT}
  LOCAL_FRAMEWORK_ACCOUNT: ${LOCAL_FRAMEWORK_ACCOUNT}
  USE_LOCAL_DEV_STACK: "false"
  LOCAL_INVOCATION_RUNNER_URL: http://local-invocation-runner:8090
  LOCAL_WEBSOCKET_CONNECTIONS_URL: http://local-ws-dev-server:8082
  LOCAL_LAMBDA_WARM: ${LOCAL_LAMBDA_WARM:-true}
  LOCAL_LAMBDA_WARM_MAX: ${LOCAL_LAMBDA_WARM_MAX:-6}
  LOCAL_LAMBDA_WARM_IDLE_SECONDS: ${LOCAL_LAMBDA_WARM_IDLE_SECONDS:-120}

services:
  example-service:
    # services["/example-service/*"]: listens on 5000 (its port),
    # runs the dev script of @repo/example-service, probed at its healthCheckPath /health.
    <<: *service
    command: [node, --import, tsx, packages/framework/scripts/run-service.ts, example-service, --, npm, --workspace, "@repo/example-service", run, dev]
    environment:
      <<: *service-environment
      PORT: "5000"
    healthcheck:
      test: [CMD, node, -e, "require('node:http').get('http://127.0.0.1:5000/health',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
