      - heading "Pending changes" [level=3] [ref=f8e165]
      - list [ref=f8e166]:
        - listitem [ref=f8e167]: "Create stack: resource:job3Identity"
      - list [ref=f8e168]:
        - listitem [ref=f8e169]: Creates the reviewed source as one undoable operation. AWS deployment and secret provisioning remain separate actions.
        - listitem [ref=f8e170]: Instantiates Job3IdentityStack in both deployment graphs, before orchestration, and exposes its typed identity pool and authenticated role through linkResources. The stack identity is deployment-prefixed.
        - listitem [ref=f8e171]: Connects the application's user pool/client. Guest and classic auth flows are disabled. Web-identity trust is constrained to this pool's aud and authenticated amr. Token role mapping denies ambiguity; the job3Identity-reader group has precedence 10. Group membership is a separate authorized operation.
        - listitem [ref=f8e172]: No AWS API permissions are granted to the role by default. Author narrow policies in this native source before using AWS resources.
        - listitem [ref=f8e173]: These source declarations do not prove successful credential issuance, group claims or effective IAM behavior; synth/diff and authorized runtime tests are separate.
